    <svg hidden><symbol id="sg-star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5-6.5 4.5 2-7.5L2 9h7z"/></symbol><symbol id="sg-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol></svg>
    <div class="cluster">
      <span><svg class="icon icon--sm" aria-hidden="true"><use href="#sg-star"/></svg> .icon--sm</span>

      <span><svg class="icon icon--lg" aria-hidden="true"><use href="#sg-star"/></svg> .icon--lg</span>
